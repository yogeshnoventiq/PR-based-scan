version: 0.2
# DevSecOps - PR Security Scan v3.5
# Uses Self-Hosted SonarQube Enterprise with Advanced Security
# Full Scan: SAST + SCA + Secrets (SBOM via SonarQube Advanced Security)
#
# v3.5: Removed branch filtering from buildspec (handled by EventBridge)
#       - Branch filtering now done at EventBridge level in app-account
#       - Reduces one SSM call per build
#
# v3.4: Configurable logging with LOG_LEVEL
#       - LOG_LEVEL: ERROR (minimal) | INFO (default) | DEBUG (verbose)
#       - Cleaner logs in production, verbose when troubleshooting
#
# v3.3: Auto-Approval when Quality Gate passes
# v3.2: Minimal dependencies - No pip install needed
# v3.1: Removed CycloneDX (SonarQube Advanced Security handles SBOM)
# v3.0: Centralized metadata onboarding (onboarded-repos.json)

env:
  variables:
    PR_ID: ""
    REPO_NAME: ""
    SOURCE_BRANCH: ""
    DEST_BRANCH: ""
    SOURCE_COMMIT: ""
    DEST_COMMIT: ""
    SOURCE_ACCOUNT_ID: ""
    SOURCE_REGION: "ap-south-1"
    # Logging: ERROR (errors only) | INFO (default) | DEBUG (verbose)
    LOG_LEVEL: "ERROR"
    # Auto-Approval settings
    ENABLE_AUTO_APPROVAL: "true"
    APPROVAL_SESSION_NAME: "SecurityScanner"

phases:
  install:
    commands:
      - |
        # ================================================================
        # LOGGER SETUP - Creates /tmp/logger.sh for use in all phases
        # ================================================================
        cat > /tmp/logger.sh << 'LOGGER_EOF'
        log_error() { echo "[ERROR] $1"; }
        log_warn()  { [[ "$LOG_LEVEL" =~ ^(WARN|INFO|DEBUG)$ ]] && echo "[WARN] $1" || true; }
        log_info()  { [[ "$LOG_LEVEL" =~ ^(INFO|DEBUG)$ ]] && echo "[INFO] $1" || true; }
        log_debug() { [ "$LOG_LEVEL" = "DEBUG" ] && echo "[DEBUG] $1" || true; }
        LOGGER_EOF
        source /tmp/logger.sh
        
        log_info "=== PR Security Scan v3.5 ==="
        
        # Fetch SonarQube credentials from Secrets Manager
        log_debug "Fetching SonarQube credentials from Secrets Manager..."
        SONAR_SECRET=$(aws secretsmanager get-secret-value --secret-id "$SONAR_SECRET_ARN" --query SecretString --output text 2>&1) || {
          log_error "Failed to fetch SonarQube secret: $SONAR_SECRET"
          exit 1
        }
        export SONAR_TOKEN=$(echo "$SONAR_SECRET" | jq -r '.token')
        export SONAR_HOST_URL=$(echo "$SONAR_SECRET" | jq -r '.host_url')
        
        if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
          log_error "SONAR_TOKEN is empty or null in secret"
          exit 1
        fi
        if [ -z "$SONAR_HOST_URL" ] || [ "$SONAR_HOST_URL" = "null" ]; then
          log_error "SONAR_HOST_URL is empty or null in secret"
          exit 1
        fi
        
        log_debug "SonarQube Host: $SONAR_HOST_URL"
        log_debug "SonarQube Token: ***${SONAR_TOKEN: -4}"
        
        # Test SonarQube connectivity
        log_debug "Testing SonarQube connectivity..."
        SONAR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/system/status" 2>&1) || SONAR_STATUS="000"
        if [ "$SONAR_STATUS" = "200" ]; then
          log_info "✅ SonarQube connected"
        elif [ "$SONAR_STATUS" = "401" ]; then
          log_error "SonarQube authentication failed (HTTP 401) - Token may be invalid"
          exit 1
        elif [ "$SONAR_STATUS" = "000" ]; then
          log_error "Cannot connect to SonarQube at $SONAR_HOST_URL - Network/Firewall issue"
          exit 1
        else
          log_warn "SonarQube returned HTTP $SONAR_STATUS - proceeding"
        fi
        
        # Save credentials for other phases
        echo "$SONAR_TOKEN" > /tmp/sonar_token
        echo "$SONAR_HOST_URL" > /tmp/sonar_host_url
      - |
        source /tmp/logger.sh
        export SONAR_TOKEN=$(cat /tmp/sonar_token)
        export SONAR_HOST_URL=$(cat /tmp/sonar_host_url)
        
        if [ -z "$PR_ID" ] || [ -z "$REPO_NAME" ] || [ -z "$SOURCE_ACCOUNT_ID" ]; then
          log_error "Missing required variables (PR_ID, REPO_NAME, SOURCE_ACCOUNT_ID)"; exit 1
        fi
        
        export SOURCE_BRANCH_CLEAN=$(echo "$SOURCE_BRANCH" | sed 's|refs/heads/||')
        export DEST_BRANCH_CLEAN=$(echo "$DEST_BRANCH" | sed 's|refs/heads/||')
        log_info "PR #${PR_ID}: ${SOURCE_BRANCH_CLEAN} → ${DEST_BRANCH_CLEAN}"
        
        export SCAN_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
        export SCAN_START_TIME=$(date +%s)
        mkdir -p /tmp/evidence /tmp/source
        echo "false" > /tmp/technical_error
        
        # Install tools (suppress output)
        log_debug "Installing tools..."
        wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 && chmod +x /usr/local/bin/yq
        which jq >/dev/null 2>&1 || yum install -y jq >/dev/null 2>&1 || true
        wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip && \
          unzip -q sonar-scanner-cli-8.1.0.6389-linux-x64.zip && mv sonar-scanner-8.1.0.6389-linux-x64 /opt/sonar-scanner && chmod +x /opt/sonar-scanner/bin/sonar-scanner
        log_debug "Tools installed"

  pre_build:
    commands:
      - |
        source /tmp/logger.sh
        [ -f /tmp/scan_status ] && [ "$(cat /tmp/scan_status)" = "SKIP" ] && exit 0
        
        export SONAR_TOKEN=$(cat /tmp/sonar_token)
        export SONAR_HOST_URL=$(cat /tmp/sonar_host_url)
        
        # ================================================================
        # CENTRALIZED ONBOARDING CHECK
        # ================================================================
        
        METADATA_FILE="${CODEBUILD_SRC_DIR}/onboarded-repos.json"
        
        if [ ! -f "$METADATA_FILE" ]; then
          log_error "Metadata file not found: $METADATA_FILE"
          echo "true" > /tmp/technical_error
          echo "Metadata file missing" > /tmp/error_message
          exit 0
        fi
        
        REPO_CONFIG=$(jq -r ".repositories[\"${REPO_NAME}\"] // empty" "$METADATA_FILE")
        
        if [ -z "$REPO_CONFIG" ]; then
          log_info "[SKIP] Repository '$REPO_NAME' is NOT onboarded"
          log_info "Add entry to onboarded-repos.json to enable scanning"
          echo "SKIP" > /tmp/scan_status
          echo "NOT_ONBOARDED" > /tmp/skip_reason
          exit 0
        fi
        
        log_info "Repository '$REPO_NAME' onboarded"
        
        # ================================================================
        # LOAD CONFIGURATION FROM METADATA
        # ================================================================
        
        APP_ID="$REPO_NAME"
        APP_NAME=$(echo "$REPO_CONFIG" | jq -r '.appName // ""')
        SONAR_PROJECT=$(echo "$REPO_CONFIG" | jq -r '.sonarProject // ""')
        REPO_LANGUAGE=$(echo "$REPO_CONFIG" | jq -r '.lang // ""')
        BU=$(echo "$REPO_CONFIG" | jq -r '.bu // ""')
        SBU=$(echo "$REPO_CONFIG" | jq -r '.sbu // ""')
        QUALITY_GATE_NAME=$(echo "$REPO_CONFIG" | jq -r '.qualityGate // ""')
        
        if [ -z "$SONAR_PROJECT" ] || [ "$SONAR_PROJECT" = "null" ]; then
          PROJECT_KEY="${REPO_NAME}-${SOURCE_ACCOUNT_ID}"
          log_debug "Using account-specific project: $PROJECT_KEY"
        else
          PROJECT_KEY="$SONAR_PROJECT"
          log_debug "Using shared project: $PROJECT_KEY"
        fi
        
        # ================================================================
        # CLONE SOURCE REPOSITORY
        # ================================================================
        
        log_debug "Cloning repository..."
        ROLE_ARN="arn:aws:iam::${SOURCE_ACCOUNT_ID}:role/PR-Scan-CodeCommit-Access-Role"
        CREDENTIALS=$(aws sts assume-role --role-arn "$ROLE_ARN" --role-session-name "pr-scan-${PR_ID}" \
          --external-id "pr-scan-cross-account" --duration-seconds 3600 --query 'Credentials' --output json 2>&1) || {
          log_error "Role assumption failed"; echo "true" > /tmp/technical_error; echo "Role assumption failed" > /tmp/error_message; exit 0
        }
        
        export APP_AWS_ACCESS_KEY_ID=$(echo "$CREDENTIALS" | jq -r '.AccessKeyId')
        export APP_AWS_SECRET_ACCESS_KEY=$(echo "$CREDENTIALS" | jq -r '.SecretAccessKey')
        export APP_AWS_SESSION_TOKEN=$(echo "$CREDENTIALS" | jq -r '.SessionToken')
        
        export AWS_ACCESS_KEY_ID="$APP_AWS_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$APP_AWS_SECRET_ACCESS_KEY"
        export AWS_SESSION_TOKEN="$APP_AWS_SESSION_TOKEN"
        
        git config --global credential.helper '!aws codecommit credential-helper $@'
        git config --global credential.UseHttpPath true
        
        REPO_URL="https://git-codecommit.${SOURCE_REGION}.amazonaws.com/v1/repos/${REPO_NAME}"
        git clone -q --progress "$REPO_URL" /tmp/source 2>/dev/null || {
          log_error "Clone failed"; echo "true" > /tmp/technical_error; echo "Clone failed" > /tmp/error_message
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; exit 0
        }
        cd /tmp/source && git checkout -q "$SOURCE_COMMIT" 2>/dev/null || true
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
        log_debug "Repository cloned"
        
        # ================================================================
        # LANGUAGE & QUALITY GATE
        # ================================================================
        
        if [ -n "$REPO_LANGUAGE" ] && [ "$REPO_LANGUAGE" != "null" ]; then
          DETECTED_LANGUAGE="$REPO_LANGUAGE"
        else
          DETECTED_LANGUAGE="generic"
        fi
        
        if [ -n "$QUALITY_GATE_NAME" ] && [ "$QUALITY_GATE_NAME" != "null" ]; then
          log_debug "Setting Quality Gate: $QUALITY_GATE_NAME"
          GATE_ID=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/list" | jq -r ".qualitygates[]|select(.name==\"${QUALITY_GATE_NAME}\")|.id" 2>/dev/null)
          if [ -n "$GATE_ID" ] && [ "$GATE_ID" != "null" ]; then
            curl -s -X POST -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/select?projectKey=${PROJECT_KEY}&gateId=${GATE_ID}" >/dev/null 2>&1
          else
            log_debug "Quality Gate '$QUALITY_GATE_NAME' not found, using default"
            QUALITY_GATE_NAME="(project default)"
          fi
        else
          QUALITY_GATE_NAME="(project default)"
        fi
        
        CORRELATION_ID="${APP_ID}-PR${PR_ID}-${SCAN_TIMESTAMP}"
        
        # Print configuration summary (always shown)
        echo ""
        echo "=========================================="
        echo "CONFIGURATION"
        echo "=========================================="
        echo "Repository:    $REPO_NAME"
        [ -n "$APP_NAME" ] && [ "$APP_NAME" != "null" ] && echo "App Name:      $APP_NAME"
        echo "Language:      $DETECTED_LANGUAGE"
        echo "SonarQube:     $PROJECT_KEY"
        echo "Quality Gate:  $QUALITY_GATE_NAME"
        echo "=========================================="
        echo ""
        
        # Save configuration
        echo "$APP_ID" > /tmp/app_id
        echo "$APP_NAME" > /tmp/app_name
        echo "$BU" > /tmp/bu
        echo "$SBU" > /tmp/sbu
        echo "$DETECTED_LANGUAGE" > /tmp/app_type
        echo "$CORRELATION_ID" > /tmp/correlation_id
        echo "$PROJECT_KEY" > /tmp/project_key
        echo "$QUALITY_GATE_NAME" > /tmp/qg_name
        echo "$SOURCE_BRANCH_CLEAN" > /tmp/source_branch_clean

  build:
    commands:
      - |
        source /tmp/logger.sh
        [ -f /tmp/scan_status ] && [ "$(cat /tmp/scan_status)" = "SKIP" ] && exit 0
        [ "$(cat /tmp/technical_error 2>/dev/null)" = "true" ] && exit 0
        
        export SONAR_TOKEN=$(cat /tmp/sonar_token)
        export SONAR_HOST_URL=$(cat /tmp/sonar_host_url)
        
        cd /tmp/source
        APP_ID=$(cat /tmp/app_id)
        PROJECT_KEY=$(cat /tmp/project_key)
        CORRELATION_ID=$(cat /tmp/correlation_id)
        DETECTED_LANGUAGE=$(cat /tmp/app_type)
        SOURCE_BRANCH_CLEAN=$(cat /tmp/source_branch_clean 2>/dev/null || echo "main")
        
        # ================================================================
        # SONARQUBE SCAN
        # ================================================================
        
        log_info "Running SonarQube scan..."
        SCAN_STATUS="UNKNOWN"
        SCANNER_QG_STATUS="UNKNOWN"
        
        EXCLUSIONS="node_modules/**,coverage/**,.git/**,vendor/**,target/**,dist/**,build/**,**/*.min.js,**/*.min.css"
        
        log_debug "SONAR_HOST_URL=$SONAR_HOST_URL"
        log_debug "SONAR_TOKEN length=$(echo -n "$SONAR_TOKEN" | wc -c) chars"
        
        # Build scanner parameters
        SONAR_PARAMS="-Dsonar.projectKey=$PROJECT_KEY"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.projectName=$APP_ID"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.sources=."
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.host.url=$SONAR_HOST_URL"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.token=$SONAR_TOKEN"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.qualitygate.wait=true"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.qualitygate.timeout=300"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.branch.name=$SOURCE_BRANCH_CLEAN"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.exclusions=$EXCLUSIONS"
        SONAR_PARAMS="$SONAR_PARAMS -Dsonar.scm.disabled=true"
        
        log_debug "Scanner: project=$PROJECT_KEY, branch=$SOURCE_BRANCH_CLEAN"
        
        # Run scanner - capture output, show only last lines on INFO, full on DEBUG
        SCANNER_OUTPUT=$(/opt/sonar-scanner/bin/sonar-scanner $SONAR_PARAMS 2>&1) && SCAN_STATUS="PASSED" || SCAN_STATUS="FAILED"
        
        if [ "$LOG_LEVEL" = "DEBUG" ]; then
          echo "$SCANNER_OUTPUT"
        else
          # Show only Quality Gate result line
          echo "$SCANNER_OUTPUT" | grep -E "(QUALITY GATE STATUS|ERROR|EXECUTION)" | tail -5
        fi
        
        if echo "$SCANNER_OUTPUT" | grep -q "QUALITY GATE STATUS: PASSED"; then
          SCANNER_QG_STATUS="OK"
        elif echo "$SCANNER_OUTPUT" | grep -q "QUALITY GATE STATUS: FAILED"; then
          SCANNER_QG_STATUS="ERROR"
        fi
        
        echo "$SCAN_STATUS" > /tmp/scan_status
        echo "$SCANNER_QG_STATUS" > /tmp/scanner_qg_status
        
        # Wait for analysis to complete
        sleep 20
        
        # ================================================================
        # FETCH RESULTS FROM SONARQUBE
        # ================================================================
        
        SCANNER_QG_STATUS=$(cat /tmp/scanner_qg_status 2>/dev/null || echo "UNKNOWN")
        
        # Initialize
        SONAR_QG_STATUS="UNKNOWN"
        BUGS_TOTAL="0" BUGS_BLOCKER="0" BUGS_HIGH="0" BUGS_MEDIUM="0" BUGS_LOW="0"
        VULN_TOTAL="0" VULN_BLOCKER="0" VULN_HIGH="0" VULN_MEDIUM="0" VULN_LOW="0"
        SECRETS_TOTAL="0" SECRETS_BLOCKER="0" SECRETS_HIGH="0" SECRETS_MEDIUM="0" SECRETS_LOW="0"
        SMELLS_TOTAL="0" SMELLS_BLOCKER="0" SMELLS_HIGH="0" SMELLS_MEDIUM="0" SMELLS_LOW="0"
        HOTSPOTS_TOTAL="0"
        
        # Quality Gate
        log_debug "Fetching Quality Gate status..."
        QG_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}")
        API_QG_STATUS=$(echo "$QG_RESPONSE" | jq -r '.projectStatus.status // "UNKNOWN"')
        
        if [ "$SCANNER_QG_STATUS" != "UNKNOWN" ]; then
          SONAR_QG_STATUS="$SCANNER_QG_STATUS"
        elif [ "$API_QG_STATUS" != "NONE" ] && [ "$API_QG_STATUS" != "null" ] && [ -n "$API_QG_STATUS" ]; then
          SONAR_QG_STATUS="$API_QG_STATUS"
        fi
        
        # Metrics
        METRICS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/measures/component?component=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,coverage,duplicated_lines_density")
        SONAR_COVERAGE=$(echo "$METRICS_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="coverage") | .value // "N/A"')
        SONAR_DUPLICATION=$(echo "$METRICS_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="duplicated_lines_density") | .value // "N/A"')
        [ -z "$SONAR_COVERAGE" ] && SONAR_COVERAGE="N/A"
        [ -z "$SONAR_DUPLICATION" ] && SONAR_DUPLICATION="N/A"
        
        # Bugs
        log_debug "Fetching Bugs..."
        BUGS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&types=BUG&facets=severities&ps=1")
        echo "$BUGS_RESPONSE" > /tmp/evidence/bugs-report.json
        BUGS_TOTAL=$(echo "$BUGS_RESPONSE" | jq -r '.total // 0')
        BUGS_BLOCKER=$(echo "$BUGS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="BLOCKER")|.count]|add // 0')
        BUGS_HIGH=$(echo "$BUGS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="CRITICAL")|.count]|add // 0')
        BUGS_MEDIUM=$(echo "$BUGS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MAJOR")|.count]|add // 0')
        BUGS_LOW=$(echo "$BUGS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MINOR" or .val=="INFO")|.count]|add // 0')
        
        # All Vulnerabilities
        log_debug "Fetching Vulnerabilities..."
        ALL_VULN_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&types=VULNERABILITY&facets=severities&ps=1")
        echo "$ALL_VULN_RESPONSE" > /tmp/evidence/all-vulnerabilities.json
        ALL_VULN_TOTAL=$(echo "$ALL_VULN_RESPONSE" | jq -r '.total // 0')
        ALL_VULN_BLOCKER=$(echo "$ALL_VULN_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="BLOCKER")|.count]|add // 0')
        ALL_VULN_HIGH=$(echo "$ALL_VULN_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="CRITICAL")|.count]|add // 0')
        ALL_VULN_MEDIUM=$(echo "$ALL_VULN_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MAJOR")|.count]|add // 0')
        ALL_VULN_LOW=$(echo "$ALL_VULN_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MINOR" or .val=="INFO")|.count]|add // 0')
        
        # Secrets
        log_debug "Fetching Secrets..."
        SECRETS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&types=VULNERABILITY&tags=secret&facets=severities&ps=1")
        echo "$SECRETS_RESPONSE" > /tmp/evidence/secrets-report.json
        SECRETS_TOTAL=$(echo "$SECRETS_RESPONSE" | jq -r '.total // 0')
        SECRETS_BLOCKER=$(echo "$SECRETS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="BLOCKER")|.count]|add // 0')
        SECRETS_HIGH=$(echo "$SECRETS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="CRITICAL")|.count]|add // 0')
        SECRETS_MEDIUM=$(echo "$SECRETS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MAJOR")|.count]|add // 0')
        SECRETS_LOW=$(echo "$SECRETS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MINOR" or .val=="INFO")|.count]|add // 0')
        
        # Fallback: try with rule pattern
        if [ "$SECRETS_TOTAL" = "0" ] || [ -z "$SECRETS_TOTAL" ]; then
          SECRETS_RESPONSE2=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&types=VULNERABILITY&rules=secrets:*&facets=severities&ps=1" 2>/dev/null)
          SECRETS_TOTAL2=$(echo "$SECRETS_RESPONSE2" | jq -r '.total // 0')
          if [ "$SECRETS_TOTAL2" -gt 0 ] 2>/dev/null; then
            SECRETS_TOTAL="$SECRETS_TOTAL2"
            SECRETS_BLOCKER=$(echo "$SECRETS_RESPONSE2" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="BLOCKER")|.count]|add // 0')
            SECRETS_HIGH=$(echo "$SECRETS_RESPONSE2" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="CRITICAL")|.count]|add // 0')
            SECRETS_MEDIUM=$(echo "$SECRETS_RESPONSE2" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MAJOR")|.count]|add // 0')
            SECRETS_LOW=$(echo "$SECRETS_RESPONSE2" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MINOR" or .val=="INFO")|.count]|add // 0')
            echo "$SECRETS_RESPONSE2" > /tmp/evidence/secrets-report.json
          fi
        fi
        
        # Code Vulnerabilities (All - Secrets)
        VULN_TOTAL=$((ALL_VULN_TOTAL - SECRETS_TOTAL))
        VULN_BLOCKER=$((ALL_VULN_BLOCKER - SECRETS_BLOCKER))
        VULN_HIGH=$((ALL_VULN_HIGH - SECRETS_HIGH))
        VULN_MEDIUM=$((ALL_VULN_MEDIUM - SECRETS_MEDIUM))
        VULN_LOW=$((ALL_VULN_LOW - SECRETS_LOW))
        [ "$VULN_TOTAL" -lt 0 ] 2>/dev/null && VULN_TOTAL="0"
        [ "$VULN_BLOCKER" -lt 0 ] 2>/dev/null && VULN_BLOCKER="0"
        [ "$VULN_HIGH" -lt 0 ] 2>/dev/null && VULN_HIGH="0"
        [ "$VULN_MEDIUM" -lt 0 ] 2>/dev/null && VULN_MEDIUM="0"
        [ "$VULN_LOW" -lt 0 ] 2>/dev/null && VULN_LOW="0"
        
        # Code Smells
        log_debug "Fetching Code Smells..."
        SMELLS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&types=CODE_SMELL&facets=severities&ps=1")
        echo "$SMELLS_RESPONSE" > /tmp/evidence/code-smells-report.json
        SMELLS_TOTAL=$(echo "$SMELLS_RESPONSE" | jq -r '.total // 0')
        SMELLS_BLOCKER=$(echo "$SMELLS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="BLOCKER")|.count]|add // 0')
        SMELLS_HIGH=$(echo "$SMELLS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="CRITICAL")|.count]|add // 0')
        SMELLS_MEDIUM=$(echo "$SMELLS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MAJOR")|.count]|add // 0')
        SMELLS_LOW=$(echo "$SMELLS_RESPONSE" | jq -r '[.facets[]?|select(.property=="severities")|.values[]?|select(.val=="MINOR" or .val=="INFO")|.count]|add // 0')
        
        # Security Hotspots
        log_debug "Fetching Security Hotspots..."
        HOTSPOTS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/hotspots/search?projectKey=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&ps=1")
        HOTSPOTS_TOTAL=$(echo "$HOTSPOTS_RESPONSE" | jq -r '.paging.total // 0')
        [ -z "$HOTSPOTS_TOTAL" ] && HOTSPOTS_TOTAL="0"
        echo "$HOTSPOTS_RESPONSE" > /tmp/evidence/hotspots-report.json
        
        # Dependencies
        log_debug "Fetching Dependencies..."
        DEPS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/measures/component?component=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&metricKeys=dependencies" 2>/dev/null)
        DEPS_COUNT=$(echo "$DEPS_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="dependencies") | .value // "0"' 2>/dev/null)
        [ -z "$DEPS_COUNT" ] && DEPS_COUNT="0"
        
        # Print Summary (always shown)
        echo ""
        echo "=========================================="
        echo "SCAN RESULTS"
        echo "=========================================="
        [ "$SONAR_QG_STATUS" = "OK" ] && echo "Quality Gate: ✅ PASSED" || echo "Quality Gate: ❌ $SONAR_QG_STATUS"
        echo ""
        echo "Bugs: $BUGS_TOTAL | Vulnerabilities: $VULN_TOTAL | Secrets: $SECRETS_TOTAL"
        echo "Code Smells: $SMELLS_TOTAL | Hotspots: $HOTSPOTS_TOTAL | Dependencies: $DEPS_COUNT"
        echo "=========================================="
        
        # Save results
        echo "$SONAR_QG_STATUS" > /tmp/sonar_qg_status
        echo "$BUGS_TOTAL" > /tmp/bugs_total; echo "$BUGS_BLOCKER" > /tmp/bugs_blocker; echo "$BUGS_HIGH" > /tmp/bugs_high; echo "$BUGS_MEDIUM" > /tmp/bugs_medium; echo "$BUGS_LOW" > /tmp/bugs_low
        echo "$VULN_TOTAL" > /tmp/vuln_total; echo "$VULN_BLOCKER" > /tmp/vuln_blocker; echo "$VULN_HIGH" > /tmp/vuln_high; echo "$VULN_MEDIUM" > /tmp/vuln_medium; echo "$VULN_LOW" > /tmp/vuln_low
        echo "$SECRETS_TOTAL" > /tmp/secrets_total; echo "$SECRETS_BLOCKER" > /tmp/secrets_blocker; echo "$SECRETS_HIGH" > /tmp/secrets_high; echo "$SECRETS_MEDIUM" > /tmp/secrets_medium; echo "$SECRETS_LOW" > /tmp/secrets_low
        echo "$SMELLS_TOTAL" > /tmp/smells_total; echo "$SMELLS_BLOCKER" > /tmp/smells_blocker; echo "$SMELLS_HIGH" > /tmp/smells_high; echo "$SMELLS_MEDIUM" > /tmp/smells_medium; echo "$SMELLS_LOW" > /tmp/smells_low
        echo "$HOTSPOTS_TOTAL" > /tmp/hotspots_total
        echo "$DEPS_COUNT" > /tmp/deps_count
        echo "$SONAR_COVERAGE" > /tmp/sonar_coverage
        echo "$SONAR_DUPLICATION" > /tmp/sonar_duplication

  post_build:
    commands:
      - |
        source /tmp/logger.sh
        [ -f /tmp/scan_status ] && [ "$(cat /tmp/scan_status)" = "SKIP" ] && exit 0
        
        # Load configuration
        APP_ID=$(cat /tmp/app_id 2>/dev/null || echo "$REPO_NAME")
        APP_NAME=$(cat /tmp/app_name 2>/dev/null || echo "")
        BU=$(cat /tmp/bu 2>/dev/null || echo "")
        SBU=$(cat /tmp/sbu 2>/dev/null || echo "")
        CORRELATION_ID=$(cat /tmp/correlation_id 2>/dev/null || echo "UNKNOWN")
        PROJECT_KEY=$(cat /tmp/project_key 2>/dev/null)
        QUALITY_GATE_NAME=$(cat /tmp/qg_name 2>/dev/null || echo "(default)")
        TECHNICAL_ERROR=$(cat /tmp/technical_error 2>/dev/null || echo "false")
        ERROR_MESSAGE=$(cat /tmp/error_message 2>/dev/null || echo "")
        SOURCE_BRANCH_CLEAN=$(cat /tmp/source_branch_clean 2>/dev/null || echo "main")
        DEST_BRANCH_CLEAN=$(echo "$DEST_BRANCH" | sed 's|refs/heads/||')
        DETECTED_LANGUAGE=$(cat /tmp/app_type 2>/dev/null || echo "generic")
        SONAR_HOST_URL=$(cat /tmp/sonar_host_url)
        
        # Load scan results
        SCAN_STATUS=$(cat /tmp/scan_status 2>/dev/null || echo "UNKNOWN")
        SONAR_QG_STATUS=$(cat /tmp/sonar_qg_status 2>/dev/null || echo "UNKNOWN")
        DEPS_COUNT=$(cat /tmp/deps_count 2>/dev/null || echo "0")
        
        BUGS_TOTAL=$(cat /tmp/bugs_total 2>/dev/null || echo "0")
        BUGS_BLOCKER=$(cat /tmp/bugs_blocker 2>/dev/null || echo "0")
        BUGS_HIGH=$(cat /tmp/bugs_high 2>/dev/null || echo "0")
        BUGS_MEDIUM=$(cat /tmp/bugs_medium 2>/dev/null || echo "0")
        BUGS_LOW=$(cat /tmp/bugs_low 2>/dev/null || echo "0")
        
        VULN_TOTAL=$(cat /tmp/vuln_total 2>/dev/null || echo "0")
        VULN_BLOCKER=$(cat /tmp/vuln_blocker 2>/dev/null || echo "0")
        VULN_HIGH=$(cat /tmp/vuln_high 2>/dev/null || echo "0")
        VULN_MEDIUM=$(cat /tmp/vuln_medium 2>/dev/null || echo "0")
        VULN_LOW=$(cat /tmp/vuln_low 2>/dev/null || echo "0")
        
        SECRETS_TOTAL=$(cat /tmp/secrets_total 2>/dev/null || echo "0")
        SECRETS_BLOCKER=$(cat /tmp/secrets_blocker 2>/dev/null || echo "0")
        SECRETS_HIGH=$(cat /tmp/secrets_high 2>/dev/null || echo "0")
        SECRETS_MEDIUM=$(cat /tmp/secrets_medium 2>/dev/null || echo "0")
        SECRETS_LOW=$(cat /tmp/secrets_low 2>/dev/null || echo "0")
        
        SMELLS_TOTAL=$(cat /tmp/smells_total 2>/dev/null || echo "0")
        SMELLS_BLOCKER=$(cat /tmp/smells_blocker 2>/dev/null || echo "0")
        SMELLS_HIGH=$(cat /tmp/smells_high 2>/dev/null || echo "0")
        SMELLS_MEDIUM=$(cat /tmp/smells_medium 2>/dev/null || echo "0")
        SMELLS_LOW=$(cat /tmp/smells_low 2>/dev/null || echo "0")
        
        HOTSPOTS_TOTAL=$(cat /tmp/hotspots_total 2>/dev/null || echo "0")
        
        # Calculate duration
        SCAN_END_TIME=$(date +%s)
        DURATION=$((SCAN_END_TIME - SCAN_START_TIME))
        DURATION_MIN=$((DURATION / 60))
        DURATION_SEC=$((DURATION % 60))
        
        # Determine overall status
        if [ "$TECHNICAL_ERROR" = "true" ]; then 
          OVERALL_STATUS="ERROR"
          MERGE_RECOMMENDATION="SCAN_ERROR"
        elif [ "$SONAR_QG_STATUS" = "ERROR" ]; then 
          OVERALL_STATUS="FAILED"
          MERGE_RECOMMENDATION="DO_NOT_MERGE"
        elif [ "$SONAR_QG_STATUS" = "OK" ]; then 
          OVERALL_STATUS="PASSED"
          MERGE_RECOMMENDATION="SAFE_TO_MERGE"
        else 
          OVERALL_STATUS="WARNING"
          MERGE_RECOMMENDATION="REVIEW_RECOMMENDED"
        fi
        
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        COMMIT_SHORT=$(echo "$SOURCE_COMMIT" | cut -c1-8)
        
        case "$OVERALL_STATUS" in 
          PASSED) STATUS_EMOJI="✅";; 
          WARNING) STATUS_EMOJI="⚠️";; 
          FAILED) STATUS_EMOJI="❌";; 
          *) STATUS_EMOJI="🔴";; 
        esac
        
        # ================================================================
        # GENERATE PR COMMENT
        # ================================================================
        
        log_debug "Generating PR comment..."
        
        echo "## 🔐 DevSecOps Security Scan Report" > /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "### $STATUS_EMOJI Overall Status: **$OVERALL_STATUS**" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        
        case "$MERGE_RECOMMENDATION" in
          SAFE_TO_MERGE) echo "> ✅ **SAFE TO MERGE** - Quality Gate passed." >> /tmp/pr_comment.md;;
          REVIEW_RECOMMENDED) echo "> ⚠️ **REVIEW RECOMMENDED** - Quality Gate status unknown." >> /tmp/pr_comment.md;;
          DO_NOT_MERGE) echo "> ❌ **DO NOT MERGE** - Quality Gate failed." >> /tmp/pr_comment.md;;
          SCAN_ERROR) echo "> 🔴 **SCAN ERROR** - $ERROR_MESSAGE" >> /tmp/pr_comment.md;;
        esac
        
        echo "" >> /tmp/pr_comment.md
        echo "---" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        
        # Scan Context
        echo "### 📋 Scan Context" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "| Property | Value |" >> /tmp/pr_comment.md
        echo "|----------|-------|" >> /tmp/pr_comment.md
        [ -n "$APP_NAME" ] && [ "$APP_NAME" != "null" ] && echo "| Application | **$APP_NAME** (\`$APP_ID\`) |" >> /tmp/pr_comment.md || echo "| Application | \`$APP_ID\` |" >> /tmp/pr_comment.md
        echo "| PR | #$PR_ID (\`$SOURCE_BRANCH_CLEAN\` → \`$DEST_BRANCH_CLEAN\`) |" >> /tmp/pr_comment.md
        [ -n "$BU" ] && [ "$BU" != "null" ] && [ -n "$SBU" ] && [ "$SBU" != "null" ] && echo "| Business Unit | $BU / $SBU |" >> /tmp/pr_comment.md
        echo "| Commit | \`$COMMIT_SHORT\` |" >> /tmp/pr_comment.md
        echo "| Language | $DETECTED_LANGUAGE |" >> /tmp/pr_comment.md
        echo "| Quality Gate | $QUALITY_GATE_NAME |" >> /tmp/pr_comment.md
        echo "| Duration | ${DURATION_MIN}m ${DURATION_SEC}s |" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "---" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        
        # Security Summary
        echo "### 🛡️ Security Summary" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "| Category | Status | Total | Blocker | Critical | Major | Minor |" >> /tmp/pr_comment.md
        echo "|----------|--------|-------|---------|----------|-------|-------|" >> /tmp/pr_comment.md
        
        [ "$BUGS_TOTAL" -gt 0 ] 2>/dev/null && BUGS_STATUS="⚠️" || BUGS_STATUS="✅"
        echo "| 🐛 Bugs | $BUGS_STATUS | $BUGS_TOTAL | $BUGS_BLOCKER | $BUGS_HIGH | $BUGS_MEDIUM | $BUGS_LOW |" >> /tmp/pr_comment.md
        
        [ "$VULN_BLOCKER" -gt 0 ] 2>/dev/null && VULN_STATUS="❌" || { [ "$VULN_HIGH" -gt 0 ] 2>/dev/null && VULN_STATUS="❌" || { [ "$VULN_TOTAL" -gt 0 ] 2>/dev/null && VULN_STATUS="⚠️" || VULN_STATUS="✅"; }; }
        echo "| 🔓 Vulnerabilities | $VULN_STATUS | $VULN_TOTAL | $VULN_BLOCKER | $VULN_HIGH | $VULN_MEDIUM | $VULN_LOW |" >> /tmp/pr_comment.md
        
        [ "$SECRETS_TOTAL" -gt 0 ] 2>/dev/null && SECRETS_STATUS="❌" || SECRETS_STATUS="✅"
        echo "| 🔑 Secrets | $SECRETS_STATUS | $SECRETS_TOTAL | $SECRETS_BLOCKER | $SECRETS_HIGH | $SECRETS_MEDIUM | $SECRETS_LOW |" >> /tmp/pr_comment.md
        
        [ "$SMELLS_BLOCKER" -gt 0 ] 2>/dev/null && SMELLS_STATUS="⚠️" || { [ "$SMELLS_HIGH" -gt 0 ] 2>/dev/null && SMELLS_STATUS="⚠️" || SMELLS_STATUS="✅"; }
        echo "| 🧹 Code Smells | $SMELLS_STATUS | $SMELLS_TOTAL | $SMELLS_BLOCKER | $SMELLS_HIGH | $SMELLS_MEDIUM | $SMELLS_LOW |" >> /tmp/pr_comment.md
        
        [ "$HOTSPOTS_TOTAL" -gt 0 ] 2>/dev/null && HOTSPOTS_STATUS="⚠️" || HOTSPOTS_STATUS="✅"
        echo "| 🔥 Security Hotspots | $HOTSPOTS_STATUS | $HOTSPOTS_TOTAL | - | - | - | - |" >> /tmp/pr_comment.md
        
        echo "" >> /tmp/pr_comment.md
        echo "---" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        
        # Quality Gate Result
        echo "### 📊 Quality Gate" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        [ "$SONAR_QG_STATUS" = "OK" ] && QG_EMOJI="✅" || { [ "$SONAR_QG_STATUS" = "ERROR" ] && QG_EMOJI="❌" || QG_EMOJI="⚠️"; }
        echo "| Gate | Status |" >> /tmp/pr_comment.md
        echo "|------|--------|" >> /tmp/pr_comment.md
        echo "| $QUALITY_GATE_NAME | $QG_EMOJI **$SONAR_QG_STATUS** |" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "---" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        
        # Dependencies
        echo "### 📦 Dependencies (SonarQube SCA)" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "| Property | Value |" >> /tmp/pr_comment.md
        echo "|----------|-------|" >> /tmp/pr_comment.md
        echo "| Dependencies | $DEPS_COUNT |" >> /tmp/pr_comment.md
        echo "| SBOM | Available in SonarQube UI |" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "---" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        
        # Quick Links
        echo "### 🔗 Quick Links" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "| Link | Description |" >> /tmp/pr_comment.md
        echo "|------|-------------|" >> /tmp/pr_comment.md
        echo "| [📊 Dashboard](${SONAR_HOST_URL}/dashboard?id=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}) | Full analysis overview |" >> /tmp/pr_comment.md
        echo "| [🔓 Issues](${SONAR_HOST_URL}/project/issues?id=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&types=VULNERABILITY) | Code vulnerabilities |" >> /tmp/pr_comment.md
        echo "| [🔑 Secrets](${SONAR_HOST_URL}/project/issues?id=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}&types=VULNERABILITY&tags=secret) | Detected secrets |" >> /tmp/pr_comment.md
        echo "| [🔥 Hotspots](${SONAR_HOST_URL}/security_hotspots?id=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}) | Security hotspots |" >> /tmp/pr_comment.md
        echo "| [📦 Dependencies](${SONAR_HOST_URL}/project/dependencies?id=${PROJECT_KEY}&branch=${SOURCE_BRANCH_CLEAN}) | Dependency analysis & SBOM |" >> /tmp/pr_comment.md
        echo "" >> /tmp/pr_comment.md
        echo "---" >> /tmp/pr_comment.md
        echo "🤖 **DevSecOps v3.5** | \`$CORRELATION_ID\` | $TIMESTAMP" >> /tmp/pr_comment.md
        
        # Post comment to CodeCommit
        log_debug "Posting PR comment..."
        export AWS_ACCESS_KEY_ID="$APP_AWS_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$APP_AWS_SECRET_ACCESS_KEY"
        export AWS_SESSION_TOKEN="$APP_AWS_SESSION_TOKEN"
        COMMENT_CONTENT=$(cat /tmp/pr_comment.md)
        aws codecommit post-comment-for-pull-request --pull-request-id "$PR_ID" --repository-name "$REPO_NAME" \
          --before-commit-id "$DEST_COMMIT" --after-commit-id "$SOURCE_COMMIT" --content "$COMMENT_CONTENT" --region "$SOURCE_REGION" >/dev/null 2>&1 || \
          aws codecommit post-comment-for-compared-commit --repository-name "$REPO_NAME" --after-commit-id "$SOURCE_COMMIT" \
            --content "$COMMENT_CONTENT" --region "$SOURCE_REGION" >/dev/null 2>&1 || true
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
        
        # Upload evidence to S3
        if [ -n "$EVIDENCE_BUCKET" ]; then
          log_debug "Uploading evidence to S3..."
          S3_PATH="s3://${EVIDENCE_BUCKET}/${SOURCE_ACCOUNT_ID}/${APP_ID}/pr-${PR_ID}"
          
          # Generate pr-scan-report.json
          jq -n \
            --arg schemaVersion "3.5" \
            --arg correlationId "$CORRELATION_ID" \
            --arg appId "$APP_ID" \
            --arg appName "$APP_NAME" \
            --arg bu "$BU" \
            --arg sbu "$SBU" \
            --arg repository "$REPO_NAME" \
            --arg prId "$PR_ID" \
            --arg sourceBranch "$SOURCE_BRANCH_CLEAN" \
            --arg destBranch "$DEST_BRANCH_CLEAN" \
            --arg commit "$SOURCE_COMMIT" \
            --arg commitShort "$COMMIT_SHORT" \
            --arg language "$DETECTED_LANGUAGE" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg duration "${DURATION_MIN}m ${DURATION_SEC}s" \
            --arg sonarProject "$PROJECT_KEY" \
            --arg qualityGate "$QUALITY_GATE_NAME" \
            --arg overallStatus "$OVERALL_STATUS" \
            --arg mergeRecommendation "$MERGE_RECOMMENDATION" \
            --arg qualityGateStatus "$SONAR_QG_STATUS" \
            --argjson bugsTotal "${BUGS_TOTAL:-0}" \
            --argjson bugsBlocker "${BUGS_BLOCKER:-0}" \
            --argjson bugsCritical "${BUGS_HIGH:-0}" \
            --argjson bugsMajor "${BUGS_MEDIUM:-0}" \
            --argjson bugsMinor "${BUGS_LOW:-0}" \
            --argjson vulnTotal "${VULN_TOTAL:-0}" \
            --argjson vulnBlocker "${VULN_BLOCKER:-0}" \
            --argjson vulnCritical "${VULN_HIGH:-0}" \
            --argjson vulnMajor "${VULN_MEDIUM:-0}" \
            --argjson vulnMinor "${VULN_LOW:-0}" \
            --argjson secretsTotal "${SECRETS_TOTAL:-0}" \
            --argjson secretsBlocker "${SECRETS_BLOCKER:-0}" \
            --argjson secretsCritical "${SECRETS_HIGH:-0}" \
            --argjson secretsMajor "${SECRETS_MEDIUM:-0}" \
            --argjson secretsMinor "${SECRETS_LOW:-0}" \
            --argjson smellsTotal "${SMELLS_TOTAL:-0}" \
            --argjson smellsBlocker "${SMELLS_BLOCKER:-0}" \
            --argjson smellsCritical "${SMELLS_HIGH:-0}" \
            --argjson smellsMajor "${SMELLS_MEDIUM:-0}" \
            --argjson smellsMinor "${SMELLS_LOW:-0}" \
            --argjson hotspotsTotal "${HOTSPOTS_TOTAL:-0}" \
            --argjson depsCount "${DEPS_COUNT:-0}" \
            --arg sonarHostUrl "$SONAR_HOST_URL" \
            '{
              schemaVersion: $schemaVersion,
              metadata: {
                correlationId: $correlationId,
                appId: $appId,
                appName: $appName,
                bu: $bu,
                sbu: $sbu,
                repository: $repository,
                prId: $prId,
                sourceBranch: $sourceBranch,
                destBranch: $destBranch,
                commit: $commit,
                commitShort: $commitShort,
                language: $language,
                timestamp: $timestamp,
                duration: $duration,
                sonarProject: $sonarProject,
                qualityGate: $qualityGate
              },
              result: {
                overallStatus: $overallStatus,
                mergeRecommendation: $mergeRecommendation,
                qualityGateStatus: $qualityGateStatus
              },
              findings: {
                bugs: {total: $bugsTotal, blocker: $bugsBlocker, critical: $bugsCritical, major: $bugsMajor, minor: $bugsMinor},
                vulnerabilities: {total: $vulnTotal, blocker: $vulnBlocker, critical: $vulnCritical, major: $vulnMajor, minor: $vulnMinor},
                secrets: {total: $secretsTotal, blocker: $secretsBlocker, critical: $secretsCritical, major: $secretsMajor, minor: $secretsMinor},
                codeSmells: {total: $smellsTotal, blocker: $smellsBlocker, critical: $smellsCritical, major: $smellsMajor, minor: $smellsMinor},
                securityHotspots: {total: $hotspotsTotal},
                dependencies: {count: $depsCount, sbom: "Available in SonarQube UI"}
              },
              links: {
                dashboard: "\($sonarHostUrl)/dashboard?id=\($sonarProject)&branch=\($sourceBranch)",
                issues: "\($sonarHostUrl)/project/issues?id=\($sonarProject)&branch=\($sourceBranch)&types=VULNERABILITY",
                secrets: "\($sonarHostUrl)/project/issues?id=\($sonarProject)&branch=\($sourceBranch)&types=VULNERABILITY&tags=secret",
                hotspots: "\($sonarHostUrl)/security_hotspots?id=\($sonarProject)&branch=\($sourceBranch)",
                dependencies: "\($sonarHostUrl)/project/dependencies?id=\($sonarProject)&branch=\($sourceBranch)"
              }
            }' > /tmp/evidence/pr-scan-report.json
          
          aws s3 cp --quiet /tmp/evidence/pr-scan-report.json "${S3_PATH}/pr-scan-report.json" 2>/dev/null
          [ -f "/tmp/evidence/bugs-report.json" ] && aws s3 cp --quiet /tmp/evidence/bugs-report.json "${S3_PATH}/sast/bugs-report.json" 2>/dev/null
          [ -f "/tmp/evidence/all-vulnerabilities.json" ] && aws s3 cp --quiet /tmp/evidence/all-vulnerabilities.json "${S3_PATH}/sast/vulnerabilities-report.json" 2>/dev/null
          [ -f "/tmp/evidence/secrets-report.json" ] && aws s3 cp --quiet /tmp/evidence/secrets-report.json "${S3_PATH}/secrets/secrets-report.json" 2>/dev/null
          [ -f "/tmp/evidence/code-smells-report.json" ] && aws s3 cp --quiet /tmp/evidence/code-smells-report.json "${S3_PATH}/sast/code-smells-report.json" 2>/dev/null
          [ -f "/tmp/evidence/hotspots-report.json" ] && aws s3 cp --quiet /tmp/evidence/hotspots-report.json "${S3_PATH}/sast/hotspots-report.json" 2>/dev/null
        fi
        
        # Emit EventBridge event
        aws events put-events --entries "[{\"Source\":\"devsecops.pr-scan\",\"DetailType\":\"PR Scan Completed\",\"Detail\":\"{\\\"correlationId\\\":\\\"$CORRELATION_ID\\\",\\\"appId\\\":\\\"$APP_ID\\\",\\\"repository\\\":\\\"$REPO_NAME\\\",\\\"prId\\\":\\\"$PR_ID\\\",\\\"status\\\":\\\"$OVERALL_STATUS\\\",\\\"qualityGate\\\":\\\"$SONAR_QG_STATUS\\\"}\",\"EventBusName\":\"default\"}]" --region "${AWS_REGION:-ap-south-1}" >/dev/null 2>&1 || true
        
        # ================================================================
        # AUTO-APPROVAL
        # ================================================================
        
        if [ "${ENABLE_AUTO_APPROVAL:-true}" = "true" ]; then
          echo ""
          if [ "$SONAR_QG_STATUS" = "OK" ]; then
            log_debug "Quality Gate PASSED - Attempting auto-approval..."
            
            ROLE_ARN="arn:aws:iam::${SOURCE_ACCOUNT_ID}:role/PR-Scan-CodeCommit-Access-Role"
            APPROVAL_CREDS=$(aws sts assume-role \
              --role-arn "$ROLE_ARN" \
              --role-session-name "${APPROVAL_SESSION_NAME:-SecurityScanner}" \
              --external-id "pr-scan-cross-account" \
              --duration-seconds 900 \
              --query 'Credentials' \
              --output json 2>&1) || {
              log_warn "Failed to assume role for approval"
            }
            
            if [ -n "$APPROVAL_CREDS" ] && echo "$APPROVAL_CREDS" | jq -e '.AccessKeyId' >/dev/null 2>&1; then
              export AWS_ACCESS_KEY_ID=$(echo "$APPROVAL_CREDS" | jq -r '.AccessKeyId')
              export AWS_SECRET_ACCESS_KEY=$(echo "$APPROVAL_CREDS" | jq -r '.SecretAccessKey')
              export AWS_SESSION_TOKEN=$(echo "$APPROVAL_CREDS" | jq -r '.SessionToken')
              
              PR_REVISION_ID=$(aws codecommit get-pull-request \
                --pull-request-id "$PR_ID" \
                --region "$SOURCE_REGION" \
                --query 'pullRequest.revisionId' \
                --output text 2>&1)
              
              if [ -n "$PR_REVISION_ID" ] && [ "$PR_REVISION_ID" != "None" ] && [ ${#PR_REVISION_ID} -eq 64 ]; then
                log_debug "PR Revision ID: $PR_REVISION_ID"
                
                APPROVAL_RESULT=$(aws codecommit update-pull-request-approval-state \
                  --pull-request-id "$PR_ID" \
                  --revision-id "$PR_REVISION_ID" \
                  --approval-state "APPROVE" \
                  --region "$SOURCE_REGION" 2>&1) && {
                  log_info "✅ PR #${PR_ID} AUTO-APPROVED"
                } || {
                  log_warn "Auto-approval failed: $APPROVAL_RESULT"
                }
              else
                log_warn "Failed to get PR revision ID"
              fi
              
              unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            fi
          else
            log_info "❌ Quality Gate FAILED - PR requires manual review"
          fi
        fi
        
        # Final summary (always shown)
        echo ""
        echo "=========================================="
        echo "SCAN COMPLETE"
        echo "=========================================="
        echo "Status: $OVERALL_STATUS"
        echo "Quality Gate: $SONAR_QG_STATUS"
        echo "Recommendation: $MERGE_RECOMMENDATION"
        [ "${ENABLE_AUTO_APPROVAL:-true}" = "true" ] && [ "$SONAR_QG_STATUS" = "OK" ] && echo "Auto-Approval: ✅ APPROVED" || echo "Auto-Approval: Manual review required"
        echo "=========================================="
        exit 0
